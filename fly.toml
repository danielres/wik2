# fly.toml app configuration file generated for 2026-03-12-ash-quickblog-kata on 2026-04-23T21:45:21+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wik2'
primary_region = 'fra'
kill_signal = 'SIGTERM'

[build]

[env]
  # Keep the app warm but avoid idle DB pings that prevent Neon from sleeping.
  DB_IDLE_INTERVAL_MS = '3600000'
  PHX_HOST = 'wik2.fly.dev'
  POOL_SIZE = '2'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1024mb'
  cpus = 1
  memory_mb = 1024
